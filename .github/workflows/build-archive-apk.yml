name: Build Archive APK from ZIP

'on':
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-archive-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Archive project
        id: project
        shell: python
        run: |
          import os
          import zipfile
          from pathlib import Path

          repo = Path.cwd()
          archives = sorted(repo.rglob('Archive-APK-Export*.zip'))
          if len(archives) != 1:
              raise SystemExit('Keep exactly one Archive-APK-Export ZIP in the repository.')
          destination = repo / '_archive_build'
          destination.mkdir(exist_ok=True)
          with zipfile.ZipFile(archives[0]) as archive:
              for entry in archive.infolist():
                  target = (destination / entry.filename).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      raise SystemExit('Unsafe ZIP entry: ' + entry.filename)
              archive.extractall(destination)
          projects = [p.parent for p in destination.rglob('settings.gradle')
                      if (p.parent / 'app/build.gradle').is_file()]
          if len(projects) != 1:
              raise SystemExit('Expected exactly one Android project in the ZIP.')
          android = projects[0]
          if not (android.parent / 'web/index.html').is_file():
              raise SystemExit('Missing web/index.html in the archive.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'android={android}\n')
          print('Project found:', android)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable APK
        working-directory: ${{ steps.project.outputs.android }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        env:
          ANDROID_PROJECT: ${{ steps.project.outputs.android }}
        run: |
          mkdir -p apk-output
          cp "$ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk" apk-output/Archive.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Archive-APK
          path: apk-output/Archive.apk
          if-no-files-found: error
          retention-days: 14
