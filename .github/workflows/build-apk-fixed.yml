name: Build Archive APK from ZIP

'on':
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Archive ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Archive-APK-Export.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "ERROR: Upload $ZIP to the repository root (not inside a folder)."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          if [[ -f extracted/Archive-APK-Export/android/settings.gradle && -f extracted/Archive-APK-Export/web/index.html ]]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/Archive-APK-Export" >> "$GITHUB_ENV"
          elif [[ -f extracted/android/settings.gradle && -f extracted/web/index.html ]]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted" >> "$GITHUB_ENV"
          else
            echo 'ERROR: Expected android/ and web/ folders were not found in ZIP.'
            find extracted -maxdepth 3 -type f | head -60
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Archive-debug-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
