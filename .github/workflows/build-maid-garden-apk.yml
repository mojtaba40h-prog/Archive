name: Build Maid Garden APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Maid-Garden-APK.zip'
      - 'android/**'
      - 'www/**'
      - '.github/workflows/build-maid-garden-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or unpack project
        shell: python
        run: |
          import os, pathlib, zipfile
          root = pathlib.Path.cwd()
          project = root if (root / 'android/settings.gradle').is_file() else None
          if project is None:
              archive = root / 'Maid-Garden-APK.zip'
              if not archive.is_file():
                  raise SystemExit('Upload Maid-Garden-APK.zip to the repository root, or upload the extracted project files.')
              target = root / 'extracted-game'
              target.mkdir(exist_ok=True)
              with zipfile.ZipFile(archive) as z:
                  for entry in z.infolist():
                      resolved = (target / entry.filename).resolve()
                      if not resolved.is_relative_to(target.resolve()):
                          raise SystemExit('Unsafe archive path')
                      z.extractall(target)
              matches = list(target.rglob('android/settings.gradle'))
              if len(matches) != 1:
                  raise SystemExit('The archive must contain exactly one android/settings.gradle file.')
              project = matches[0].parent.parent
          if not (project / 'www/index.html').is_file():
              raise SystemExit('Missing offline game: www/index.html')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('GAME_PROJECT=' + str(project) + '\n')

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Android SDK manually
        run: |
          echo "Setting up Android SDK environment..."
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools.zip -d temp_tools
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf commandlinetools.zip temp_tools
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;34.0.0" "platform-tools"


      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Retain development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maid-garden-debug
