name: Build Maid Garden APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the APK as a GitHub Release (direct download link)'
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - 'Maid-Garden-APK.zip'
      - 'android/**'
      - 'www/**'
      - '.github/workflows/build-maid-garden-apk.yml'

# "write" is only used by the optional Release step
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Works with BOTH layouts:
      #   1) Maid-Garden-APK.zip uploaded to the repo root (no need to extract it)
      #   2) The extracted project (android/ + www/) uploaded to the repo root
      - name: Locate or unpack project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/settings.gradle ]; then
            PROJECT="$PWD"
          else
            if [ ! -f Maid-Garden-APK.zip ]; then
              echo "::error::Upload Maid-Garden-APK.zip to the repository root, or upload the extracted project files (android/ and www/)."
              exit 1
            fi
            rm -rf extracted-game
            mkdir extracted-game
            unzip -q Maid-Garden-APK.zip -d extracted-game
            mapfile -t MATCHES < <(find extracted-game -path '*/android/settings.gradle')
            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "::error::The archive must contain exactly one android/settings.gradle (found ${#MATCHES[@]})."
              exit 1
            fi
            PROJECT="$(cd "$(dirname "${MATCHES[0]}")/.." && pwd)"
          fi
          if [ ! -f "$PROJECT/www/index.html" ]; then
            echo "::error::Missing game file: www/index.html"
            exit 1
          fi
          echo "Project directory: $PROJECT"
          echo "GAME_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME), so no extra
      # setup action is needed; we only accept licenses and make sure the
      # required platform / build-tools are present.
      - name: Install Android platform and build tools
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keeps the same debug signing key between builds so new APKs
      # can update the installed app without uninstalling it first.
      - name: Retain debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maid-garden-debug-key-v1

      - name: Build APK
        working-directory: ${{ env.GAME_PROJECT }}/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK file
        run: |
          set -euo pipefail
          SRC="$GAME_PROJECT/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          mkdir -p dist
          cp "$SRC" dist/Maid-Garden.apk
          ls -lh dist/Maid-Garden.apk
          echo "APK_PATH=$PWD/dist/Maid-Garden.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maid-Garden-APK
          path: dist/Maid-Garden.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Maid Garden APK #${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}"
