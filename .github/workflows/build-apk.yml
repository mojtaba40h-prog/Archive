name: Build Archive APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Archive-Android-Ready.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q Archive-Android-Ready.zip -d extracted
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install, test, and prepare offline files
        working-directory: extracted/Archive-Android-Ready
        run: |
          npm install --no-audit --no-fund
          npm test
          node scripts/prepare-web.cjs
          npx cap add android
      - name: Build debug APK
        working-directory: extracted/Archive-Android-Ready/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Archive-debug-APK
          path: extracted/Archive-Android-Ready/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
